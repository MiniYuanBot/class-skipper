# Example course manifest. Copy it to <course-folder>/input/course.yaml and edit.
# Paths are relative to the manifest. The manifest is optional: without it the
# skill pairs slides and transcripts by file name and asks when that is unclear.
# List only each lecture's own deck: when a transcript finishes the previous deck
# or starts the next one, the skill reads the adjacent decks itself.
schema_version: '1'
title: 操作系统                     # course name shown in output/index.md
options:                           # run options for every lecture (optional)
  thought_questions: true          # write instructor thought questions; default false
  thought_question_terms: [思考题, Think]  # optional: what this instructor calls them
models:                            # subagent models (optional; not a run option)
  # Omit `models`, a host section, a role or a field to use the session's own
  # model and effort. The coordinator is always the session you started.
  # Roles: workers (default for reader, writer, figure, links), reader, writer,
  # figure, links, editor (falls back to the session, not to workers).
  # A value is a model string or {model: ..., effort: ...}.
  claude:                          # Claude Code: only the aliases opus | sonnet | haiku | fable
    workers: {model: sonnet, effort: xhigh}   # (not full IDs such as claude-sonnet-5-5)
    editor: {model: opus, effort: xhigh}        # effort: low | medium | high | xhigh | max
  codex:                           # Codex: a model ID the host lists
    workers: {model: gpt-6.1-sol, effort: max}   # effort: low | medium | high |
    editor: {model: gpt-6-astra, effort: max}      #   xhigh | max | ultra
    links: {effort: low}           # same model as workers, lower effort
lectures:                         # processed in this order
- id: l02                          # stored as L02
  title: 操作系统的四个基本概念
  slides:
  - L02/slides.pdf
  transcripts:
  - L02/transcript.docx
- id: l03
  title: 进程、系统调用与 fork
  slides:                          # several decks or transcripts are allowed
  - L03/slides-part1.pdf
  - L03/slides-part2.pdf
  transcripts:
  - L03/transcript.docx
- id: l04
  title: 一切皆文件
  slides:
  - L04/slides.pdf                 # no transcript: the deck alone defines the scope
  options:
    thought_questions: false       # a lecture's options override the course's
