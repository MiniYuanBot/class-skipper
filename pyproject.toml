[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "class-skipper"
version = "0.2.0"
description = "Read a lecture, plan its structure, write sections, revise once."
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "PyYAML>=6,<7", "pypdfium2>=5,<6", "python-docx>=1.2,<2", "python-pptx>=1,<2", "Pillow>=12,<13"]

[project.scripts]
class-skipper = "class_skipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
class_skipper = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
